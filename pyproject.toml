[project]
name = "ediscovery-review-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "absl-py>=2.5.0",
    "cloudpickle>=3.1.2",
    "google-adk>=2.4.0",
    "google-cloud-aiplatform>=1.160.0",
    "google-genai>=2.10.0",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "streamlit>=1.59.0",
    "asyncpg>=0.29.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-grpc>=0.40b0",
    "opentelemetry-instrumentation-httpx>=0.40b0",
    "opentelemetry-instrumentation-google-genai<=0.7b1",
    "opentelemetry-util-genai<=0.3b0",
    "opentelemetry-exporter-gcp-logging",
    "opentelemetry-resourcedetector-gcp<1.13.0",
    "google-cloud-modelarmor",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ediscovery_review_assistant"]
